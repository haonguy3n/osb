name: release

# Publishes osb from the version in ./VERSION, so anyone (including the
# osb-demo project) can fetch the current binary instead of cloning and
# compiling:
#
#   https://github.com/haonguy3n/osb/releases/latest/download/osb-linux-amd64
#
# Bump VERSION to cut a new release; a merge that does not bump it refreshes the
# assets of the release that version already has, so the download always carries
# main's current build.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release halfway through.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: build and publish osb
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Read the version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "VERSION must look like 0.0.1, got '$version'" >&2; exit 1 ;;
          esac
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "release $version"
      - name: Build the binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${{ steps.version.outputs.value }}" \
              -o "dist/osb-linux-$arch" ./cmd/osb
          done
          ./dist/osb-linux-amd64 version
          (cd dist && sha256sum osb-linux-* > SHA256SUMS && cat SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION exists - refreshing its assets"
            gh release upload "$VERSION" --clobber dist/osb-linux-amd64 dist/osb-linux-arm64 dist/SHA256SUMS
            gh release edit "$VERSION" --latest
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              --latest \
              dist/osb-linux-amd64 dist/osb-linux-arm64 dist/SHA256SUMS
          fi
