name: features

# One job per feature combination, on top of the distro/arch smoke matrix in
# ci.yml. These build an image with the feature turned on, boot it in QEMU and
# assert what the running guest actually did - so they need more host tooling
# (ukify, sbsign, mtools, virt-fw-vars, swtpm) and more time than ci.yml.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # The feeds these build from move under us; run nightly on main even when
    # nothing changed.
    - cron: '17 3 * * *'

concurrency:
  group: features-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature:
    name: ${{ matrix.case }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: verity-secureboot
            image: verity-image
            script: verity-secureboot.sh
            machine: qemu-x86_64
            distro: ubuntu
            runner: ubuntu-24.04
            qemu: qemu-system-x86 ovmf
          - case: crypt-tpm
            image: crypt-image
            script: crypt-tpm.sh
            machine: qemu-x86_64
            distro: ubuntu
            runner: ubuntu-24.04
            qemu: qemu-system-x86 ovmf
          - case: ab
            image: ab-image
            script: ab.sh
            machine: qemu-x86_64
            distro: ubuntu
            runner: ubuntu-24.04
            qemu: qemu-system-x86 ovmf
          - case: readonly
            image: readonly-image
            script: readonly.sh
            machine: qemu-x86_64
            distro: ubuntu
            runner: ubuntu-24.04
            qemu: qemu-system-x86 ovmf
          - case: readonly-alpine
            # The same feature on the other package manager: the scripts are
            # written for busybox ash as well as dash, and this case reuses the
            # alpine toolchain image ci.yml already cached.
            image: readonly-image
            script: readonly.sh
            machine: qemu-x86_64
            distro: alpine
            runner: ubuntu-24.04
            qemu: qemu-system-x86 ovmf
          - case: signed-shim
            # The distro's own signed chain: firmware -> shim-signed -> the
            # distro's signed GRUB -> its signed kernel, under the firmware's
            # stock keys (osb enrols nothing on this path). The image turns on
            # readonly only; verity is refused with this loader because grub.cfg
            # and the initramfs would be unsigned.
            image: signed-image
            script: signed-shim.sh
            machine: qemu-x86_64
            distro: ubuntu
            runner: ubuntu-24.04
            qemu: qemu-system-x86 ovmf
          - case: verity-shim
            # shim as the first stage with osb's own signed UKI as the second:
            # the firmware's vendor keys trust shim, and osb's certificate is
            # added to that same varstore, which is where MOK carries it on real
            # hardware. The guest only boots if shim verified the UKI, and the UKI
            # is the thing that carries the verity root hash.
            image: signed-verity-image
            script: verity-shim.sh
            machine: qemu-x86_64
            distro: ubuntu
            runner: ubuntu-24.04
            qemu: qemu-system-x86 ovmf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install QEMU and feature tooling
        # systemd-ukify + sbsigntool sign the UKI, mtools writes it to the ESP,
        # python3-virt-firmware enrolls the project key into the OVMF variables,
        # swtpm provides the TPM for the tpm/encrypt cases.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ${{ matrix.qemu }} sbsigntool mtools systemd-ukify python3-virt-firmware swtpm swtpm-tools
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          unshare --user --map-root-user true
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      - name: Build osb
        run: |
          go build -o osb ./cmd/osb
          sudo install osb /usr/local/bin/osb
      - name: Prepare project
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/features/project" "$RUNNER_TEMP/features"
          echo "OSB_PROJECT=$RUNNER_TEMP/features" >> "$GITHUB_ENV"
      - name: Create the project's Secure Boot key
        # Before the build: the image is signed with this key, and `osb run`
        # enrolls the same certificate into the firmware variables. Without it
        # both fall back to the embedded public test key.
        run: osb key secure-boot
      - name: Cache key inputs
        id: week
        # The toolchain image holds the builder (compiler, apk/deb tooling), not
        # the target packages, which are fetched fresh every build. Let the cache
        # roll over weekly so a moved base image is picked up without paying for
        # a full rebuild on every push.
        run: echo "week=$(date +%Y-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache the toolchain image
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/osb-toolchains.tar.zst
          key: toolchain-${{ runner.arch }}-${{ matrix.distro }}-${{ hashFiles('stdlib/module-*/containers/**') }}-${{ steps.week.outputs.week }}
      - name: Load the toolchain image
        # A cache that cannot be loaded must not fail the job: osb rebuilds the
        # image when the loaded one does not match the build context anyway.
        if: steps.toolchain.outputs.cache-hit == 'true'
        run: |
          zstd -dc "$RUNNER_TEMP/osb-toolchains.tar.zst" | docker load \
            || echo "warning: cached toolchain image unusable; rebuilding"
      - name: Build ${{ matrix.image }}
        run: osb build ${{ matrix.image }} -machine ${{ matrix.machine }} -distro ${{ matrix.distro }}
      - name: Save the toolchain image for the cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          images=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^osb/toolchain' || true)
          [ -n "$images" ] || exit 0
          docker save $images | zstd -T0 -3 > "$RUNNER_TEMP/osb-toolchains.tar.zst"
      - name: Boot and test
        run: |
          cat tests/features/lib.sh "tests/features/${{ matrix.script }}" > "$RUNNER_TEMP/feature-test.sh"
          set +e
          osb run -test "$RUNNER_TEMP/feature-test.sh" ${{ matrix.image }} \
            -machine ${{ matrix.machine }} -distro ${{ matrix.distro }} 2>&1 | tee "$RUNNER_TEMP/boot.log"
          rc=${PIPESTATUS[0]}
          exit $rc
      - name: Publish the test output as an annotation
        # Job logs and artifacts need a token to read; check-run annotations do
        # not, so a failing case puts the guest output somewhere a reviewer (or a
        # tool) can read it straight from the API. The guest keeps printing to
        # the console after the test runs, so cut at the script's own header
        # rather than taking a byte tail of the whole log.
        if: failure()
        env:
          CASE: ${{ matrix.case }}
        run: |
          log="$RUNNER_TEMP/boot.log"
          [ -f "$log" ] || exit 0
          msg=$(sed -n '/^Linux .* on /,$p' "$log" | tail -300)
          if [ -z "$msg" ]; then
            msg=$(tail -c 4000 "$log")
          fi
          # osb's own run prologue - firmware choice, key enrollment, image and
          # QEMU errors - comes before any guest output.
          msg="--- osb run prologue ---
          $(head -40 "$log")
          --- guest test ---
          $msg"
          python3 - "$msg" "$CASE" <<'PY'
          import sys
          text = sys.argv[1]
          for i in range(0, max(len(text), 1), 8000):
              chunk = text[i:i + 8000].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print('::error title=feature test (%s)::%s' % (sys.argv[2], chunk))
          PY
      - name: Collect build logs
        if: failure()
        run: |
          mkdir -p logs
          cd "$OSB_PROJECT/build" && find . -name '*.log' -exec cp --parents {} "$GITHUB_WORKSPACE/logs" \; || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: feature-logs-${{ matrix.case }}
          path: logs
          if-no-files-found: ignore

  installer:
    # The installer ISO is a different shape from the other cases: it boots the
    # image's kernel without any guest login to SSH into, so it is asserted from
    # the host - the initrd has to carry the storage drivers a VM gives it, the
    # installer has to write the image to the target disk, and the disk has to
    # match the image byte for byte. Nothing in CI booted an ISO before this,
    # which is how a missing VMware (LSI/PVSCSI) driver went unnoticed.
    name: installer-iso
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DISTRO: alpine
      MACHINE: x86_64
      IMAGE: iso-image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install QEMU
        # No ukify/swtpm here: the ISO carries limine, the installer kernel and
        # the image itself. cpio is for reading the initrd's module list.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf cpio
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          unshare --user --map-root-user true
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      - name: Build osb
        run: |
          go build -o osb ./cmd/osb
          sudo install osb /usr/local/bin/osb
      - name: Prepare project
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/features/project" "$RUNNER_TEMP/features"
          echo "OSB_PROJECT=$RUNNER_TEMP/features" >> "$GITHUB_ENV"
      - name: Cache key inputs
        id: week
        run: echo "week=$(date +%Y-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache the toolchain image
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/osb-toolchains.tar.zst
          key: toolchain-${{ runner.arch }}-${{ env.DISTRO }}-${{ hashFiles('stdlib/module-*/containers/**') }}-${{ steps.week.outputs.week }}
      - name: Load the toolchain image
        if: steps.toolchain.outputs.cache-hit == 'true'
        run: |
          zstd -dc "$RUNNER_TEMP/osb-toolchains.tar.zst" | docker load \
            || echo "warning: cached toolchain image unusable; rebuilding"
      - name: Build the installer ISO
        run: osb build "$IMAGE" -machine "$MACHINE" -distro "$DISTRO"
      - name: Save the toolchain image for the cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          images=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^osb/toolchain' || true)
          [ -n "$images" ] || exit 0
          docker save $images | zstd -T0 -3 > "$RUNNER_TEMP/osb-toolchains.tar.zst"
      - name: The initrd has to see a VM's disk
        # The drivers have to be inside the initrd, not merely in the root
        # filesystem: a disc the initrd cannot see is a disc nothing can install
        # to, and the same initrd boots the installed system afterwards.
        run: |
          initrd="$OSB_PROJECT/build/$DISTRO/$IMAGE.$MACHINE/destdir/rootfs/boot/osb-initrd.img"
          ls -l "$initrd"
          gzip -dc "$initrd" | cpio -t 2>/dev/null | grep '\.ko' | sed 's|.*/||' | sort -u > "$RUNNER_TEMP/initrd-modules.txt"
          wc -l < "$RUNNER_TEMP/initrd-modules.txt"
          missing=0
          for m in mptspi mptsas mpt3sas megaraid_sas vmw_pvscsi hv_storvsc; do
            grep -qx "$m.ko.gz" "$RUNNER_TEMP/initrd-modules.txt" || { echo "initrd is missing $m"; missing=1; }
          done
          [ "$missing" = 0 ]
      - name: Unattended install from the ISO
        run: |
          iso="$OSB_PROJECT/build/$DISTRO/$IMAGE.$MACHINE/destdir/$IMAGE.iso"
          # The image's cmdline has to have reached the ISO's boot entry, or the
          # run below would sit at the installer's prompt.
          grep -aq 'osb.target=/dev/vda' "$iso" || { echo "ISO boot entry has no osb.target"; exit 1; }
          grep -aq "osb.install=/osb/$IMAGE.img.gz" "$iso" || { echo "ISO boot entry has no osb.install"; exit 1; }
          echo "target:      $(grep -a -o 'osb.target=[^ ]*' "$iso" | head -1)"
          echo "installation: $(grep -a -o 'osb.install=[^ ]*' "$iso" | head -1)"
          set +e
          timeout 1200 osb run -iso "$IMAGE" -machine "$MACHINE" -distro "$DISTRO" 2>&1 | tee "$RUNNER_TEMP/install.log"
          rc=${PIPESTATUS[0]}
          exit $rc
      - name: The installer wrote the image to the target disk
        run: |
          dest="$OSB_PROJECT/build/$DISTRO/$IMAGE.$MACHINE/destdir"
          src="$dest/$IMAGE.img"
          tgt="$dest/$IMAGE.target.img"
          ls -l "$src" "$tgt"
          size=$(stat -c %s "$src")
          # The installer gunzips the image straight onto the disk, so the start
          # of the target has to be the image, byte for byte. This is the
          # assertion: an installer that wrote nothing, the wrong device or a
          # truncated image all fail it.
          cmp -n "$size" "$src" "$tgt"
          echo "target disk matches the first $size bytes of $IMAGE.img"
          # Not an assertion: the installer's own messages go to /dev/console,
          # which this machine points at the screen (console=tty0) so that an
          # interactive install can be answered on a virtual machine's keyboard.
          # A headless run therefore only sees kernel output on the serial log.
          sed -n 's/^osb: /installer: /p' "$RUNNER_TEMP/install.log" | tail -5 || true
      - name: Publish the installer output as an annotation
        if: failure()
        run: |
          log="$RUNNER_TEMP/install.log"
          [ -f "$log" ] || exit 0
          python3 - "$log" <<'PY'
          import sys
          try:
              data = open(sys.argv[1], 'rb').read().decode('utf-8', 'replace')
          except OSError:
              sys.exit(0)
          tail = data[-12000:]
          for i in range(0, len(tail), 6000):
              chunk = tail[i:i + 6000].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print('::error title=installer iso::%s' % chunk)
          PY
      - name: Collect build logs
        if: failure()
        run: |
          mkdir -p logs
          cd "$OSB_PROJECT/build" && find . -name '*.log' -exec cp --parents {} "$GITHUB_WORKSPACE/logs" \; || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installer-logs
          path: logs
          if-no-files-found: ignore
